app = "educational-web-portal-master"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  APP_ENV = "production"
  APP_DEBUG = "false"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/mnt/database/database.sqlite"
  APP_URL = "https://educational-web-portal-master.fly.dev"

[[mounts]]
  source = "sqlite_data"
  destination = "/mnt/database"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
